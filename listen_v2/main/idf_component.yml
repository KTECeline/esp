## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.0.0'
  # ES7210 mic + I2S/I2C helpers. This is the ONLY external dep we need.
  # No esp-box-3 BSP -> no esp_lvgl_port -> no LVGL version conflict.
  espressif/esp_codec_dev: '^1.1.0'
  # ILI9341 LCD driver (esp_lcd, NOT LVGL) for the status display.
  espressif/esp_lcd_ili9341: '^1.2.0'
  # QR encoder (nayuki wrapper) for the WiFi-provisioning screen.
  espressif/qrcode: '^0.1.0'
  # Resolves mcp-core.local so the provisioning form never needs a raw LAN IP.
  espressif/mdns: '^1.2.0'
  # TT21100 touch controller — same chip already probed (display.c) to detect
  # the panel type. Proof-of-concept only: logs raw coordinates, no UI yet.
  espressif/esp_lcd_touch: '^1.1.0'
  espressif/esp_lcd_touch_tt21100: '^1.0.4'
