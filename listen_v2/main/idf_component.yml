## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.0.0'
  # ES7210 mic + I2S/I2C helpers. This is the ONLY external dep we need.
  # No esp-box-3 BSP -> no esp_lvgl_port -> no LVGL version conflict.
  espressif/esp_codec_dev: '^1.1.0'
  # ILI9341 LCD driver (esp_lcd, NOT LVGL) for the status display.
  espressif/esp_lcd_ili9341: '^1.2.0'
  # QR encoder (nayuki wrapper) for the WiFi-provisioning screen.
  espressif/qrcode: '^0.1.0'
  # Resolves mcp-core.local so the provisioning form never needs a raw LAN IP.
  espressif/mdns: '^1.2.0'
  # BOX-3 units shipped with EITHER a TT21100 or a GT911 touch controller
  # depending on hardware revision (confirmed on real units: one tested unit
  # has GT911 at I2C 0x5D, not TT21100 at 0x24 — display.c's ST7789/ILI9341
  # panel-type probe, which only checks 0x24, is NOT a reliable indicator of
  # which touch chip is present). touch.c probes both and uses whichever
  # responds. Proof-of-concept only: logs raw coordinates, no UI yet.
  espressif/esp_lcd_touch: '^1.1.0'
  espressif/esp_lcd_touch_tt21100: '^1.0.4'
  espressif/esp_lcd_touch_gt911: '^1.1.5'
