# systemd drop-in for an ALREADY-INSTALLED spc-agent.
#
# Install to /etc/systemd/system/spc-agent.service.d/10-devices.conf
#
# WHY A DROP-IN AND NOT AN EDIT: this fleet's OrangePi already ships a
# system-level spc-agent.service running /opt/spc-agent/spc_agent.py, installed
# by whoever set the box up. A drop-in adds settings without touching their unit
# file, so a later reinstall of theirs does not silently revert this and does not
# conflict with it. (spc-agent.service in this directory is the OTHER case: a
# fresh box with nothing installed yet. Do not use both.)
#
# Every value here is a device-selection fix. The stock defaults all point at
# the wrong hardware on this particular board.

[Service]
# ALSA card NAME, not number. Numbering follows probe order and can shift on
# reboot. "Lite" is the ReSpeaker Lite's stable card id (aplay -l).
#
# The default of "default" resolves via ~/.asoundrc to the onboard ES8388 codec,
# which nothing is plugged into. That failure is SILENT — aplay exits 0 and the
# agent reports success while the room hears nothing. See spc_agent.py:156.
Environment=SPC_SPEAKER_DEVICE=plughw:CARD=Lite,DEV=0
Environment=SPC_MIC_DEVICE=plughw:CARD=Lite,DEV=0

# The rkcif raw Bayer node. /dev/video0 exists on this board but is an ISP node
# that never yields a frame — the Rockchip ISP needs the rkaiq 3A daemon, which
# this image does not ship. See mcp-core/vision.js for the same problem solved
# on the mcp-core side.
#
# BACKEND MUST BE v4l2raw: plain ffmpeg cannot open this node at all (fails
# with a misleading "No such device" — it's actually a format negotiation
# failure, not a missing device). v4l2raw captures via v4l2-ctl and unpacks
# RAW10 -> greyscale itself; ffmpeg is only used afterward to encode the
# JPEG. WIDTH/HEIGHT/RAW_FORMAT already default to this sensor's values
# (4224x3136 BG10) so they don't need to be repeated here.
Environment=SPC_CAMERA_DEVICE=/dev/video11
Environment=SPC_CAMERA_BACKEND=v4l2raw

# Real voice instead of espeak-ng. Text arrives on stdin, the command writes a
# WAV to {out}. spc_tts.py must be readable by root at this path.
Environment="SPC_TTS_CMD=/usr/bin/python3 /opt/spc-agent/spc_tts.py {out}"
